[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapy-grpc"
version = "2.0.0"
description = "Scrapy extension to control spiders using gRPC"
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "rangertaha" }]
keywords = ["scrapy", "grpc", "crawler", "spider"]
classifiers = [
    "Framework :: Scrapy",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "grpcio>=1.82.1",
    "protobuf>=7.35.1",
    "Scrapy>=2.17",
]

[project.urls]
Homepage = "https://github.com/rangertaha/scrapy-grpc"
Repository = "https://github.com/rangertaha/scrapy-grpc"
Issues = "https://github.com/rangertaha/scrapy-grpc/issues"
Changelog = "https://github.com/rangertaha/scrapy-grpc/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "mypy>=2",
    "pytest-cov>=7",
    "grpcio-tools>=1.82.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scrapy_grpc"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["_pb2\\.py$", "_pb2_grpc\\.py$"]

# Generated protobuf/gRPC modules are untyped; treat them as Any.
[[tool.mypy.overrides]]
module = "scrapy_grpc.pb.*"
follow_imports = "skip"
ignore_errors = true

# CrawlerServicer subclasses the (untyped) generated servicer base class.
[[tool.mypy.overrides]]
module = "scrapy_grpc.webservice"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
